<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>My AWS Static Website</title>

<link rel="stylesheet" href="style.css">


</head>

<body>

<div class="container">

    <div class="hero">

        <div class="content">

            <div class="aws-logo">
                ☁
            </div>

            <p class="small-title">
                AMAZON WEB SERVICES
            </p>

            <h1>
                Welcome to My
                <span>AWS Website</span>
            </h1>

            <p class="description">
                A modern static website hosted on
                <strong>Amazon S3</strong>.
            </p>

            <button onclick="showMessage()">
                Explore Now →
            </button>

            <p id="message"></p>

        </div>


        <div class="aws-card">

            <div class="circle">
                ☁️
            </div>

            <h2>Amazon S3</h2>

            <p>
                Simple. Secure. Scalable.
            </p>

            <div class="line"></div>

            <div class="status">
                <span></span>
                Website Online
            </div>

        </div>

    </div>

    <div class="bottom-text">
        <p>Built with HTML • CSS • JavaScript</p>
        <p>☁ Hosted on Amazon S3</p>
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
